<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoLent - Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #00e676;
            --secondary-color: #00c853;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --light-text: #ffffff;
            --bg-color: #0B111B;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition-speed: 0.3s;
            --font-family-primary: 'Space Grotesk', sans-serif;
            --font-family-secondary: 'Inter', sans-serif;
        }

        /* Dark theme variables */
        :root[data-theme="dark"] {
            --primary-color: #00e676;
            --secondary-color: #00c853;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --light-text: #ffffff;
            --bg-color: #0B111B;
            --card-bg: rgba(255, 255, 255, 0.05);
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-secondary);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Login Container */
        .login-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 400px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
        }

        .logo-container {
            position: relative;
            margin: 0 auto 15px;
            width: 80px;
            height: 80px;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            background: rgba(0, 230, 118, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .logo-circle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .logo-image {
            width: 45px;
            height: 45px;
            object-fit: contain;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .logo-circle:hover {
            transform: scale(1.05) rotate(5deg);
        }

        .logo-circle:hover .logo-image {
            transform: scale(1.1);
        }

        /* Welcome Text */
        .welcome-text {
            font-family: var(--font-family-primary);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: slideInDown 0.8s ease-out 0.2s both;
        }

        .welcome-subtitle {
            font-family: var(--font-family-secondary);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        /* Selected Email Card */
        .email-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        .email-card .icon {
            background: rgba(0, 230, 118, 0.1);
            color: var(--primary-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
        }

        .email-card .email-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            flex-grow: 1;
            word-break: break-all;
        }

        /* Form Group */
        .form-group {
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.2);
            transform: translateY(-2px);
        }

        .input-icon {
            padding: 0 15px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--primary-color);
        }

        .form-input {
            width: 100%;
            padding: 16px 0;
            background: transparent;
            border: none;
            font-family: var(--font-family-secondary);
            font-size: 1rem;
            color: #ffffff;
            outline: none;
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .toggle-password {
            padding: 0 15px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: color 0.3s ease;
            font-size: 1.1rem;
        }

        .toggle-password:hover {
            color: #ffffff;
        }

        /* Forgot Password */
        .forgot-password {
            text-align: right;
            margin-top: -15px;
            animation: fadeInUp 0.8s ease-out 0.7s both;
        }

        .forgot-password a {
            color: var(--primary-color);
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        /* Continue Button */
        .continue-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: var(--font-family-primary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease-out 0.8s both;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .continue-btn:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 230, 118, 0.3);
        }

        .continue-btn:active {
            transform: translateY(0);
        }

        /* Bottom Text */
        .bottom-text {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
            animation: fadeInUp 0.8s ease-out 0.9s both;
        }

        .bottom-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: color 0.3s ease;
            display: inline-block;
            margin-top: 5px;
        }

        .bottom-text a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                max-width: 90%;
                border-radius: 16px;
            }
            
            .welcome-text {
                font-size: 1.4rem;
            }
            
            .logo-container {
                width: 70px;
                height: 70px;
            }
            
            .logo-image {
                width: 40px;
                height: 40px;
            }
            
            .bottom-text a {
                display: block;
                margin-top: 5px;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-container">
                <div class="logo-circle">
                    <img src="https://i.ibb.co.com/QjvffmCv/ic-launcher.png" alt="IoLent Logo" class="logo-image">
                </div>
            </div>
            
            <h1 class="welcome-text">Enter Your Password</h1>
            <p class="welcome-subtitle">Enter the password for your selected account.</p>
        </div>

        <!-- Selected Email Card -->
        <div class="email-card">
            <div class="icon">
                <i class="fas fa-user"></i>
            </div>
            <div class="email-text">
                john@gmail.com
            </div>
        </div>

        <!-- Password Form -->
        <div class="form-group">
            <div class="input-wrapper">
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                </div>
                <input type="password" class="form-input" placeholder="Password" id="passwordInput">
                <div class="toggle-password" id="togglePassword">
                    <i class="fas fa-eye"></i>
                </div>
            </div>
            <div id="passwordError" style="color: #ff5252; font-size: 0.85rem; margin-top: 8px; display: none; text-align: left; padding-left: 10px;"></div>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-password">
            <a href="#" onclick="window.location.href='ForgetPass.html'; return false;">Forgot Password?</a>
        </div>

        <!-- Continue Button -->
        <button class="continue-btn" id="continueBtn">
            Continue
        </button>

        <!-- Bottom Text -->
        <div class="bottom-text">
            Need another account? <a href="#" onclick="window.location.href='Login.html'; return false;">Choose another Google Account</a>
        </div>

    </div>

    <script>
        window.isSubmitting = false;
        window.email_check_code = ""; // Global variable for redirect

        function showLoading() {
            let overlay = document.getElementById('dynamicLoadingOverlay');
            if (!overlay) {
                // Add the CSS for spinner dynamically to avoid modifying static HTML/CSS
                if (!document.getElementById('dynamicLoadingStyles')) {
                    const style = document.createElement('style');
                    style.id = 'dynamicLoadingStyles';
                    style.textContent = `
                        .dynamic-loading-overlay {
                            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                            background: rgba(11, 17, 27, 0.8); backdrop-filter: blur(5px);
                            display: flex; justify-content: center; align-items: center;
                            z-index: 9999;
                        }
                        .dynamic-spinner {
                            width: 50px; height: 50px;
                            border: 5px solid rgba(0, 230, 118, 0.2);
                            border-top: 5px solid #00e676;
                            border-radius: 50%;
                            animation: dynamic-spin 1s linear infinite;
                        }
                        @keyframes dynamic-spin {
                            0% { transform: rotate(0deg); }
                            100% { transform: rotate(360deg); }
                        }
                    `;
                    document.head.appendChild(style);
                }

                overlay = document.createElement('div');
                overlay.id = 'dynamicLoadingOverlay';
                overlay.className = 'dynamic-loading-overlay';
                
                const spinner = document.createElement('div');
                spinner.className = 'dynamic-spinner';
                overlay.appendChild(spinner);
                
                document.body.appendChild(overlay);
            }
            overlay.style.display = 'flex';
        }

        function hideLoading() {
            const overlay = document.getElementById('dynamicLoadingOverlay');
            if (overlay) {
                overlay.style.display = 'none';
            }
            window.isSubmitting = false; // Reset submitting state
        }

        function onAuthSuccess() {
            hideLoading();
            
            // Redirect using location.replace for better WebView compatibility
            if (window.email_check_code === "0") {
                window.location.replace("PinSetup.html");
            } else if (window.email_check_code === "1") {
                window.location.replace("PinVerify.html");
            } else {
                console.error("email_check_code is invalid upon auth success:", window.email_check_code);
            }
        }

        function showErrorDialog(message) {
            let overlay = document.getElementById('dynamicErrorModal');
            if (!overlay) {
                // Add styles
                if (!document.getElementById('dynamicModalStyles')) {
                    const style = document.createElement('style');
                    style.id = 'dynamicModalStyles';
                    style.textContent = `
                        .dynamic-modal-overlay {
                            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                            background: rgba(11, 17, 27, 0.8); backdrop-filter: blur(5px);
                            display: flex; justify-content: center; align-items: center;
                            z-index: 2000; opacity: 0; transition: opacity 0.3s ease;
                        }
                        .dynamic-modal-overlay.show { opacity: 1; }
                        .dynamic-modal-content {
                            background: rgba(255, 255, 255, 0.05);
                            border: 1px solid rgba(255, 255, 255, 0.1);
                            border-radius: 20px; padding: 30px;
                            width: 90%; max-width: 350px; text-align: center;
                            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
                            transform: translateY(20px); transition: transform 0.3s ease;
                            position: relative;
                        }
                        .dynamic-modal-overlay.show .dynamic-modal-content {
                            transform: translateY(0);
                        }
                        .dynamic-modal-icon { font-size: 3rem; color: #ff5252; margin-bottom: 15px; }
                        .dynamic-modal-title {
                            font-family: 'Space Grotesk', sans-serif; color: #ffffff;
                            font-size: 1.5rem; margin-bottom: 10px; font-weight: 700;
                        }
                        .dynamic-modal-message {
                            color: rgba(255, 255, 255, 0.8); font-size: 1rem;
                            margin-bottom: 25px; line-height: 1.5; font-family: 'Inter', sans-serif;
                        }
                        .dynamic-modal-btn {
                            background: #00e676; color: #000; border: none;
                            padding: 12px 30px; border-radius: 10px; font-size: 1rem;
                            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
                            width: 100%; font-family: 'Inter', sans-serif;
                        }
                        .dynamic-modal-btn:hover {
                            background: #00c853; transform: translateY(-2px);
                        }
                        .dynamic-modal-close {
                            position: absolute; top: 15px; right: 15px;
                            color: rgba(255,255,255,0.5); cursor: pointer;
                            font-size: 1.2rem; transition: color 0.3s ease;
                        }
                        .dynamic-modal-close:hover { color: #ffffff; }
                    `;
                    document.head.appendChild(style);
                }

                overlay = document.createElement('div');
                overlay.id = 'dynamicErrorModal';
                overlay.className = 'dynamic-modal-overlay';
                
                // Click outside to close
                overlay.addEventListener('click', function(e) {
                    if (e.target === overlay) {
                        closeErrorDialog();
                    }
                });

                // ESC to close
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && overlay.style.display === 'flex') {
                        closeErrorDialog();
                    }
                });

                overlay.innerHTML = `
                    <div class="dynamic-modal-content">
                        <i class="fas fa-times dynamic-modal-close" onclick="closeErrorDialog()"></i>
                        <div class="dynamic-modal-icon">
                            <i class="fas fa-exclamation-circle"></i>
                        </div>
                        <h3 class="dynamic-modal-title">Authentication Failed</h3>
                        <p id="dynamicModalMessage" class="dynamic-modal-message"></p>
                        <button class="dynamic-modal-btn" onclick="closeErrorDialog()">OK</button>
                    </div>
                `;
                
                document.body.appendChild(overlay);
            }
            
            document.getElementById('dynamicModalMessage').textContent = message;
            overlay.style.display = 'flex';
            
            // Allow display: flex to apply before adding class for animation
            setTimeout(() => {
                overlay.classList.add('show');
            }, 10);
        }

        function closeErrorDialog() {
            const overlay = document.getElementById('dynamicErrorModal');
            if (overlay) {
                overlay.classList.remove('show');
                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 300);
            }
        }

        function onAuthFailed(message) {
            hideLoading();
            showErrorDialog(message);
        }

        function sendEmail(data) {
            if (data === null || data === undefined) {
                console.error("Invalid data received: null or undefined");
                return;
            }

            const dataStr = String(data).trim();
            const parts = dataStr.split("|");

            if (parts.length !== 2) {
                console.error("Invalid data format received. Expected format: email|code. Received: " + dataStr);
                return;
            }

            const email = parts[0].trim();
            window.email_check_code = parts[1].trim();

            if (email === "") {
                console.error("Invalid data format: Email part is empty.");
                return;
            }

            if (window.email_check_code !== "0" && window.email_check_code !== "1") {
                console.error("Invalid data format: Code must be 0 or 1. Received: " + window.email_check_code);
                return;
            }

            // Valid data, proceed to update UI
            const emailElement = document.querySelector('.email-text');
            if (emailElement) {
                emailElement.textContent = email;
            }

            const welcomeTitle = document.querySelector('.welcome-text');
            const welcomeSubtitle = document.querySelector('.welcome-subtitle');
            const forgotPassword = document.querySelector('.forgot-password');

            if (window.email_check_code === "0") {
                // Registration Mode
                if (welcomeTitle) welcomeTitle.textContent = "ENTER A PASSWORD";
                if (welcomeSubtitle) welcomeSubtitle.textContent = "Enter a password for your selected Google account.";
                if (forgotPassword) forgotPassword.style.display = "none";
            } else if (window.email_check_code === "1") {
                // Login Mode
                if (welcomeTitle) welcomeTitle.textContent = "ENTER YOUR PASSWORD";
                if (welcomeSubtitle) welcomeSubtitle.textContent = "Enter your password for your selected Google account.";
                if (forgotPassword) forgotPassword.style.display = ""; 
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Android !== 'undefined' && Android.iamReady) {
                Android.iamReady("email2");
            }
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('passwordInput');
            const continueBtn = document.getElementById('continueBtn');

            // Password Toggle Animation
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                const icon = this.querySelector('i');
                if (type === 'text') {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });

            const passwordError = document.getElementById('passwordError');

            passwordInput.addEventListener('input', function() {
                const pwd = this.value.trim();
                if (pwd.length >= 6 && pwd.length <= 12) {
                    passwordError.style.display = 'none';
                    passwordError.textContent = '';
                }
            });

            // Button Click Handler
            continueBtn.addEventListener('click', function(e) {
                if (window.isSubmitting) return; // Prevent duplicate rapid clicks

                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);

                const pwd = passwordInput.value.trim();
                
                if (pwd === '') {
                    passwordError.textContent = 'Please enter your password.';
                    passwordError.style.display = 'block';
                    return;
                }
                
                if (pwd.length < 6) {
                    passwordError.textContent = 'Password must be at least 6 characters.';
                    passwordError.style.display = 'block';
                    return;
                }
                
                if (pwd.length > 12) {
                    passwordError.textContent = 'Password cannot be more than 12 characters.';
                    passwordError.style.display = 'block';
                    return;
                }
                
                passwordError.style.display = 'none';
                passwordError.textContent = '';

                // Password passed validation successfully
                window.isSubmitting = true;

                // Prepend the prefix
                const data = "PASS00" + pwd;

                // Call Android bridge
                if (typeof Android !== 'undefined' && typeof Android.authFB === 'function') {
                    Android.authFB(data);
                } else {
                    console.log("Mock Android bridge call:", data);
                }

                // Immediately show loading
                showLoading();
            });
        });
    </script>
</body>
</html>
