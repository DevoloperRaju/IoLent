<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoLent - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #00e676;
            --secondary-color: #00c853;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --light-text: #ffffff;
            --bg-color: #0B111B;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-radius: 12px;
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --transition-speed: 0.3s;
            --font-family-primary: 'Space Grotesk', sans-serif;
            --font-family-secondary: 'Inter', sans-serif;
        }

        /* Dark theme variables */
        :root[data-theme="dark"] {
            --primary-color: #00e676;
            --secondary-color: #00c853;
            --accent-color: #00e676;
            --text-color: #ffffff;
            --light-text: #ffffff;
            --bg-color: #0B111B;
            --card-bg: rgba(255, 255, 255, 0.05);
            --box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-secondary);
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Login Container */
        .login-container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--box-shadow);
            width: 100%;
            max-width: 400px;
            z-index: 10;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
        }

        .logo-container {
            position: relative;
            margin: 0 auto 15px;
            width: 80px;
            height: 80px;
        }

        .logo-circle {
            width: 100%;
            height: 100%;
            background: rgba(0, 230, 118, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .logo-circle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .logo-image {
            width: 45px;
            height: 45px;
            object-fit: contain;
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .logo-circle:hover {
            transform: scale(1.05) rotate(5deg);
        }

        .logo-circle:hover .logo-image {
            transform: scale(1.1);
        }

        /* Welcome Text */
        .welcome-text {
            font-family: var(--font-family-primary);
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: slideInDown 0.8s ease-out 0.2s both;
        }

        .welcome-subtitle {
            font-family: var(--font-family-secondary);
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            animation: fadeIn 0.8s ease-out 0.4s both;
        }

        /* Selected Email Card */
        .email-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        .email-card .icon {
            background: rgba(0, 230, 118, 0.1);
            color: var(--primary-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
        }

        .email-card .email-text {
            font-size: 0.95rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            flex-grow: 1;
            word-break: break-all;
        }

        /* Continue Button */
        .continue-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary-color);
            color: #000;
            border: none;
            border-radius: 12px;
            font-family: var(--font-family-primary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeInUp 0.8s ease-out 0.8s both;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .continue-btn:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 230, 118, 0.3);
        }

        .continue-btn:active {
            transform: translateY(0);
        }

        /* Bottom Text */
        .bottom-text {
            text-align: center;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 10px;
            animation: fadeInUp 0.8s ease-out 0.9s both;
        }

        .bottom-text a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: color 0.3s ease;
            display: inline-block;
            margin-top: 5px;
        }

        .bottom-text a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
                max-width: 90%;
                border-radius: 16px;
            }
            
            .welcome-text {
                font-size: 1.4rem;
            }
            
            .logo-container {
                width: 70px;
                height: 70px;
            }
            
            .logo-image {
                width: 40px;
                height: 40px;
            }
            
            .bottom-text a {
                display: block;
                margin-top: 5px;
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Login Container -->
    <div class="login-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-container">
                <div class="logo-circle">
                    <img src="https://i.ibb.co.com/QjvffmCv/ic-launcher.png" alt="IoLent Logo" class="logo-image">
                </div>
            </div>
            
            <h1 class="welcome-text">Forgot Password</h1>
            <p class="welcome-subtitle">Verify your selected Google account to continue.</p>
        </div>

        <!-- Selected Email Card -->
        <div class="email-card">
            <div class="icon">
                <i class="fas fa-user"></i>
            </div>
            <div class="email-text">
                Loading...
            </div>
        </div>

        <!-- Verify Button -->
        <button class="continue-btn" id="verifyBtn">
            Verify Google Account
        </button>

        <!-- Bottom Text -->
        <div class="bottom-text">
            Need another account? <a href="#" onclick="window.location.href='Login.html'; return false;">Choose another Google Account</a>
        </div>

    </div>

    <script>
        function sendEmail(email) {
            if (email !== null && email !== undefined && String(email).trim() !== '') {
                const emailElement = document.querySelector('.email-text');
                if (emailElement) {
                    emailElement.textContent = String(email).trim();
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof Android !== 'undefined' && Android.iamReady) {
                Android.iamReady("email");
            }
            
            const verifyBtn = document.getElementById('verifyBtn');

            // Button Click Animation (UI Only)
            verifyBtn.addEventListener('click', function(e) {
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
                
                // Android verification will be added later.
            });
        });
    </script>
</body>
</html>
